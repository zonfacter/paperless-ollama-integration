      # Optional fuer abweichenden Workspace-Mount:
      # OPEN_WEBUI_WORKSPACE_HOST_PATH: "/volume1/docker/paperless-ai/paperless-ollama-integration"
      # OPEN_WEBUI_WORKSPACE_ROOT: "/workspace/project"
