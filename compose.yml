services:
  broker:
    image: redis:7-bookworm
    container_name: paperless-broker
    restart: unless-stopped
    cpus: "${BROKER_CPUS:-0.50}"
    mem_limit: "${BROKER_MEM_LIMIT:-256m}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/redis:/data
    networks:
      - paperless-ai

  db:
    image: postgres:16-bookworm
    container_name: paperless-db
    restart: unless-stopped
    cpus: "${DB_CPUS:-1.50}"
    mem_limit: "${DB_MEM_LIMIT:-2g}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - paperless-ai

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    restart: unless-stopped
    cpus: "${GOTENBERG_CPUS:-2.00}"
    mem_limit: "${GOTENBERG_MEM_LIMIT:-2g}"
    shm_size: "${GOTENBERG_SHM_SIZE:-1g}"
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - paperless-ai

  tika:
    image: apache/tika:${TIKA_IMAGE_TAG:-3.1.0.0-full}
    container_name: paperless-tika
    restart: unless-stopped
    cpus: "${TIKA_CPUS:-1.00}"
    mem_limit: "${TIKA_MEM_LIMIT:-2g}"
    environment:
      TIKA_SERVER_OPTS: "-c /tika-config.xml"
    volumes:
      - ./config/tika-config.xml:/tika-config.xml:ro
    networks:
      - paperless-ai

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.3
    container_name: paperless-webserver
    restart: unless-stopped
    cpus: "${PAPERLESS_WEBSERVER_CPUS:-2.00}"
    mem_limit: "${PAPERLESS_WEBSERVER_MEM_LIMIT:-2g}"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TASK_WORKERS: 1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')\""]
      interval: 30s
      timeout: 10s
      retries: 10
    ports:
      - "${PAPERLESS_BIND_HOST:-0.0.0.0}:${PAPERLESS_PUBLIC_PORT:-8000}:8000"
    volumes:
      - ${PAPERLESS_CONSUME_HOST_PATH:-./data/paperless/consume}:/usr/src/paperless/consume
      - ./data/paperless/media:/usr/src/paperless/media
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/data:/usr/src/paperless/data
      - ./config/paperless-ai.env:/config/paperless-ai.env
      - ./config/tessdata-best:/config/tessdata-best
      - ./hooks:/usr/src/paperless-ai/hooks:ro
      - ./prompts:/usr/src/paperless-ai/prompts:ro
      - ./scripts:/usr/src/paperless-ai/scripts:ro
      - ./config:/usr/src/paperless-ai/config:ro
    networks:
      - paperless-ai

  consumer:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.3
    container_name: paperless-consumer
    restart: unless-stopped
    cpus: "${PAPERLESS_CONSUMER_CPUS:-1.50}"
    mem_limit: "${PAPERLESS_CONSUMER_MEM_LIMIT:-1536m}"
    entrypoint: []
    working_dir: /usr/src/paperless/src
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      webserver:
        condition: service_started
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    command:
      - /bin/bash
      - -lc
      - mkdir -p /tmp/paperless && python manage.py document_consumer
    healthcheck:
      disable: true
    volumes:
      - ${PAPERLESS_CONSUME_HOST_PATH:-./data/paperless/consume}:/usr/src/paperless/consume
      - ./data/paperless/media:/usr/src/paperless/media
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/data:/usr/src/paperless/data
      - ./config/paperless-ai.env:/config/paperless-ai.env
      - ./config/tessdata-best:/config/tessdata-best
      - ./hooks:/usr/src/paperless-ai/hooks:ro
      - ./prompts:/usr/src/paperless-ai/prompts:ro
      - ./scripts:/usr/src/paperless-ai/scripts:ro
      - ./config:/usr/src/paperless-ai/config:ro
    networks:
      - paperless-ai

  task-queue:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.3
    container_name: paperless-task-queue
    restart: unless-stopped
    cpus: "${PAPERLESS_TASK_QUEUE_CPUS:-2.00}"
    mem_limit: "${PAPERLESS_TASK_QUEUE_MEM_LIMIT:-2g}"
    entrypoint: []
    working_dir: /usr/src/paperless/src
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    command:
      - /bin/bash
      - -lc
      - mkdir -p /tmp/paperless && celery --app paperless worker --loglevel INFO
    healthcheck:
      disable: true
    volumes:
      - ${PAPERLESS_CONSUME_HOST_PATH:-./data/paperless/consume}:/usr/src/paperless/consume
      - ./data/paperless/media:/usr/src/paperless/media
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/data:/usr/src/paperless/data
      - ./config/paperless-ai.env:/config/paperless-ai.env
      - ./config/tessdata-best:/config/tessdata-best
      - ./hooks:/usr/src/paperless-ai/hooks:ro
      - ./prompts:/usr/src/paperless-ai/prompts:ro
      - ./scripts:/usr/src/paperless-ai/scripts:ro
      - ./config:/usr/src/paperless-ai/config:ro
    networks:
      - paperless-ai

  scheduler:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.3
    container_name: paperless-scheduler
    restart: unless-stopped
    cpus: "${PAPERLESS_SCHEDULER_CPUS:-0.50}"
    mem_limit: "${PAPERLESS_SCHEDULER_MEM_LIMIT:-512m}"
    entrypoint: []
    working_dir: /usr/src/paperless/src
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
    command:
      - /bin/bash
      - -lc
      - mkdir -p /tmp/paperless && celery --app paperless beat --loglevel INFO --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    volumes:
      - ./config/paperless-ai.env:/config/paperless-ai.env
      - ./config/tessdata-best:/config/tessdata-best
      - ./data/paperless/data:/usr/src/paperless/data
      - ./hooks:/usr/src/paperless-ai/hooks:ro
      - ./prompts:/usr/src/paperless-ai/prompts:ro
      - ./scripts:/usr/src/paperless-ai/scripts:ro
      - ./config:/usr/src/paperless-ai/config:ro
    networks:
      - paperless-ai

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.20.2}
    container_name: paperless-ollama
    restart: unless-stopped
    cpus: "${OLLAMA_CPUS:-6.00}"
    mem_limit: "${OLLAMA_MEM_LIMIT:-12g}"
    env_file:
      - ./.env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      HSA_OVERRIDE_GFX_VERSION: ${OLLAMA_HSA_OVERRIDE_GFX_VERSION:-9.0.6}
      DRI_PRIME: ${OLLAMA_DRI_PRIME:-pci-0000_04_00_0!}
      MESA_VK_DEVICE_SELECT: ${OLLAMA_MESA_VK_DEVICE_SELECT:-1002:66a1!}
      HIP_VISIBLE_DEVICES: ${OLLAMA_HIP_VISIBLE_DEVICES:-0}
      ROCR_VISIBLE_DEVICES: ${OLLAMA_ROCR_VISIBLE_DEVICES:-0}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
    ports:
      - "${OLLAMA_BIND_HOST:-127.0.0.1}:${OLLAMA_PUBLIC_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    group_add:
      - "${OLLAMA_RENDER_GID:-105}"
      - "${OLLAMA_VIDEO_GID:-44}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - paperless-ai

  paperless-ai-web:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: docker/paperless-ai-web/Dockerfile
    container_name: paperless-ai-web
    restart: unless-stopped
    cpus: "${PAPERLESS_AI_WEB_CPUS:-1.00}"
    mem_limit: "${PAPERLESS_AI_WEB_MEM_LIMIT:-1g}"
    depends_on:
      webserver:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - ./.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PAPERLESS_CONF: /config/paperless-ai.env
      PAPERLESS_BACKFILL: /usr/src/paperless-ai/scripts/ai_backfill.py
      PAPERLESS_PREVIEW_CONFIG_PATH: /data/preview_config.json
      PAPERLESS_BACKFILL_STATE_PATH: /data/backfill_jobs.json
      PAPERLESS_PROVIDER_CONFIG_PATH: /data/provider_config.json
      PAPERLESS_MODEL_CONFIG_PATH: /data/model_config.json
      PAPERLESS_BACKFILL_JOB_RETENTION_HOURS: "${PAPERLESS_BACKFILL_JOB_RETENTION_HOURS:-168}"
      PAPERLESS_BACKFILL_JOB_MAX_ENTRIES: "${PAPERLESS_BACKFILL_JOB_MAX_ENTRIES:-120}"
      PADDLEOCR_API_INSTALL_SCRIPT: /usr/src/paperless-ai/scripts/install-paddleocr-api.sh
    ports:
      - "${PAPERLESS_AI_WEB_BIND_HOST:-0.0.0.0}:${PAPERLESS_AI_WEB_PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./config/paperless-ai.env:/config/paperless-ai.env
      - ./data/paperless-ai-web:/data
      - ./hooks/ai_enrich.py:/opt/paperless/ai_enrich.py:ro
      - ./prompts/ai_enrich_prompt.txt:/opt/paperless/ai_enrich_prompt.txt:ro
      - ./hooks:/usr/src/paperless-ai/hooks:ro
      - ./prompts:/usr/src/paperless-ai/prompts:ro
      - ./scripts:/usr/src/paperless-ai/scripts:ro
      - ./config:/usr/src/paperless-ai/config:ro
      - /sys:/host_sys:${PAPERLESS_HOST_SYS_MOUNT_MODE:-rw}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./web:/app/web:ro
      - ./web/server.py:/app/server.py:ro
    networks:
      - paperless-ai

  open-webui:
    profiles: ["chat-ui"]
    build:
      context: .
      dockerfile: docker/open-webui/Dockerfile
      args:
        OPEN_WEBUI_IMAGE_TAG: ${OPEN_WEBUI_IMAGE_TAG:-v0.8.12}
    image: paperless-open-webui:${OPEN_WEBUI_IMAGE_TAG:-v0.8.12}
    container_name: paperless-open-webui
    restart: unless-stopped
    cpus: "${OPEN_WEBUI_CPUS:-2.00}"
    mem_limit: "${OPEN_WEBUI_MEM_LIMIT:-2g}"
    depends_on:
      ollama:
        condition: service_started
    environment:
      WEBUI_URL: ${OPEN_WEBUI_URL:-http://localhost:8081}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-CHANGE_ME_OPEN_WEBUI_SECRET}
      OPEN_WEBUI_WORKSPACE_ROOT: ${OPEN_WEBUI_WORKSPACE_ROOT:-/workspace/project}
      ENABLE_OLLAMA_API: ${OPEN_WEBUI_ENABLE_OLLAMA_API:-true}
      OLLAMA_BASE_URL: ${OPEN_WEBUI_OLLAMA_BASE_URL:-http://ollama:11434}
      ENABLE_OPENAI_API: ${OPEN_WEBUI_ENABLE_OPENAI_API:-true}
      OPENAI_API_BASE_URL: ${OPEN_WEBUI_OPENAI_API_BASE_URL:-http://llama-cpp:8080/v1}
      OPENAI_API_KEY: ${OPEN_WEBUI_OPENAI_API_KEY:-dummy}
      ENABLE_IMAGE_GENERATION: ${OPEN_WEBUI_ENABLE_IMAGE_GENERATION:-false}
      ENABLE_IMAGE_PROMPT_GENERATION: ${OPEN_WEBUI_ENABLE_IMAGE_PROMPT_GENERATION:-false}
      IMAGE_GENERATION_ENGINE: ${OPEN_WEBUI_IMAGE_GENERATION_ENGINE:-openai}
      IMAGE_GENERATION_MODEL: ${OPEN_WEBUI_IMAGE_GENERATION_MODEL:-gpt-image-1}
      IMAGE_SIZE: ${OPEN_WEBUI_IMAGE_SIZE:-512x512}
      IMAGES_OPENAI_API_BASE_URL: ${OPEN_WEBUI_IMAGES_OPENAI_API_BASE_URL:-http://openvino-image:8000/v3}
      IMAGES_OPENAI_API_KEY: ${OPEN_WEBUI_IMAGES_OPENAI_API_KEY:-dummy}
      AUTOMATIC1111_BASE_URL: ${OPEN_WEBUI_AUTOMATIC1111_BASE_URL:-}
      AUTOMATIC1111_API_AUTH: ${OPEN_WEBUI_AUTOMATIC1111_API_AUTH:-}
      COMFYUI_BASE_URL: ${OPEN_WEBUI_COMFYUI_BASE_URL:-http://comfyui-amd:8188}
      COMFYUI_API_KEY: ${OPEN_WEBUI_COMFYUI_API_KEY:-}
      COMFYUI_WORKFLOW: ${OPEN_WEBUI_COMFYUI_WORKFLOW:-}
      OPEN_WEBUI_COMFYUI_WORKFLOW_FILE: ${OPEN_WEBUI_COMFYUI_WORKFLOW_FILE:-/opt/paperless-open-webui/workflows/comfyui_txt2img_api.json}
      OPEN_WEBUI_COMFYUI_WORKFLOW_NODES_FILE: ${OPEN_WEBUI_COMFYUI_WORKFLOW_NODES_FILE:-/opt/paperless-open-webui/workflows/comfyui_txt2img_nodes.json}
      # RAG / file upload
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: ${OPEN_WEBUI_USER_PERMISSIONS_CHAT_FILE_UPLOAD:-true}
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: ${OPEN_WEBUI_USER_PERMISSIONS_CHAT_WEB_UPLOAD:-true}
      RAG_EMBEDDING_ENGINE: ${OPEN_WEBUI_RAG_EMBEDDING_ENGINE:-ollama}
      RAG_EMBEDDING_MODEL: ${OPEN_WEBUI_RAG_EMBEDDING_MODEL:-nomic-embed-text:latest}
      RAG_OLLAMA_BASE_URL: ${OPEN_WEBUI_OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_FILE_MAX_SIZE: ${OPEN_WEBUI_RAG_FILE_MAX_SIZE:-209715200}
      RAG_FILE_MAX_COUNT: ${OPEN_WEBUI_RAG_FILE_MAX_COUNT:-40}
      RAG_ALLOWED_FILE_EXTENSIONS: ${OPEN_WEBUI_RAG_ALLOWED_FILE_EXTENSIONS:-txt,md,pdf,doc,docx,rtf,csv,xls,xlsx,ppt,pptx,json,xml,html}
      PDF_EXTRACT_IMAGES: ${OPEN_WEBUI_PDF_EXTRACT_IMAGES:-True}
      CHUNK_SIZE: ${OPEN_WEBUI_CHUNK_SIZE:-1500}
      CHUNK_OVERLAP: ${OPEN_WEBUI_CHUNK_OVERLAP:-150}
      RAG_TOP_K: ${OPEN_WEBUI_RAG_TOP_K:-5}
      ENABLE_RAG_HYBRID_SEARCH: ${OPEN_WEBUI_ENABLE_RAG_HYBRID_SEARCH:-True}
      # PaddleOCR-Proxy für gescannte PDFs (bessere Qualität als Tesseract)
      CONTENT_EXTRACTION_ENGINE: ${OPEN_WEBUI_CONTENT_EXTRACTION_ENGINE:-tika}
      TIKA_SERVER_URL: ${OPEN_WEBUI_TIKA_SERVER_URL:-http://tika-ocr-proxy:9998}
    ports:
      - "${OPEN_WEBUI_BIND_HOST:-0.0.0.0}:${OPEN_WEBUI_PUBLIC_PORT:-8081}:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
      - ${OPEN_WEBUI_WORKSPACE_HOST_PATH:-.}:${OPEN_WEBUI_WORKSPACE_ROOT:-/workspace/project}:rw
    networks:
      - paperless-ai

  openvino-image:
    profiles: ["image-intel"]
    image: openvino/model_server:${OPENVINO_IMAGE_TAG:-latest-gpu}
    container_name: paperless-openvino-image
    restart: unless-stopped
    cpus: "${OPENVINO_IMAGE_CPUS:-4.00}"
    mem_limit: "${OPENVINO_IMAGE_MEM_LIMIT:-12g}"
    environment:
      no_proxy: ${no_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    command:
      - --rest_port
      - "8000"
      - --model_repository_path
      - /models
      - --task
      - image_generation
      - --source_model
      - ${OPENVINO_IMAGE_SOURCE_MODEL:-OpenVINO/stable-diffusion-v1-5-int8-ov}
      - --target_device
      - ${OPENVINO_IMAGE_TARGET_DEVICE:-GPU}
    expose:
      - "8000"
    volumes:
      - ./data/openvino-image-models:/models:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${OLLAMA_RENDER_GID:-105}"
    networks:
      - paperless-ai

  comfyui-amd:
    profiles: ["image-amd"]
    build:
      context: .
      dockerfile: docker/comfyui-amd/Dockerfile
      args:
        ROCM_PYTORCH_IMAGE: ${COMFYUI_AMD_ROCM_PYTORCH_IMAGE:-rocm/pytorch:latest}
        COMFYUI_REF: ${COMFYUI_AMD_REF:-master}
    image: paperless-comfyui-amd:${COMFYUI_AMD_IMAGE_TAG:-latest}
    container_name: paperless-comfyui-amd
    restart: unless-stopped
    cpus: "${COMFYUI_AMD_CPUS:-6.00}"
    mem_limit: "${COMFYUI_AMD_MEM_LIMIT:-16g}"
    environment:
      HSA_OVERRIDE_GFX_VERSION: ${COMFYUI_AMD_HSA_OVERRIDE_GFX_VERSION:-9.0.6}
      HIP_VISIBLE_DEVICES: ${COMFYUI_AMD_HIP_VISIBLE_DEVICES:-0}
      ROCR_VISIBLE_DEVICES: ${COMFYUI_AMD_ROCR_VISIBLE_DEVICES:-0}
      PYTORCH_HIP_ALLOC_CONF: ${COMFYUI_AMD_PYTORCH_HIP_ALLOC_CONF:-expandable_segments:True,garbage_collection_threshold:0.8}
      COMFYUI_PORT: ${COMFYUI_AMD_PORT:-8188}
      COMFYUI_LISTEN: ${COMFYUI_AMD_LISTEN:-0.0.0.0}
      COMFYUI_EXTRA_ARGS: ${COMFYUI_AMD_EXTRA_ARGS:---disable-auto-launch --preview-method none --disable-smart-memory --use-split-cross-attention --fp16-vae}
    expose:
      - "8188"
    volumes:
      - ./data/comfyui/models:/opt/ComfyUI/models
      - ./data/comfyui/input:/opt/ComfyUI/input
      - ./data/comfyui/output:/opt/ComfyUI/output
      - ./data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
    group_add:
      - "${OLLAMA_RENDER_GID:-105}"
      - "${OLLAMA_VIDEO_GID:-44}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - paperless-ai

  automatic1111-amd:
    profiles: ["image-amd-a1111"]
    build:
      context: .
      dockerfile: docker/automatic1111-amd/Dockerfile
    image: paperless-automatic1111-amd:${AUTOMATIC1111_AMD_IMAGE_TAG:-latest}
    container_name: paperless-automatic1111-amd
    restart: unless-stopped
    cpus: "${AUTOMATIC1111_AMD_CPUS:-6.00}"
    mem_limit: "${AUTOMATIC1111_AMD_MEM_LIMIT:-16g}"
    environment:
      HSA_OVERRIDE_GFX_VERSION: ${AUTOMATIC1111_AMD_HSA_OVERRIDE_GFX_VERSION:-9.0.6}
      HIP_VISIBLE_DEVICES: ${AUTOMATIC1111_AMD_HIP_VISIBLE_DEVICES:-0}
      ROCR_VISIBLE_DEVICES: ${AUTOMATIC1111_AMD_ROCR_VISIBLE_DEVICES:-0}
      PYTORCH_HIP_ALLOC_CONF: ${AUTOMATIC1111_AMD_PYTORCH_HIP_ALLOC_CONF:-garbage_collection_threshold:0.6,max_split_size_mb:6144}
      COMMANDLINE_ARGS: ${AUTOMATIC1111_AMD_COMMAND_ARGS:---listen --port 7860 --api --precision full --no-half --no-half-vae --skip-torch-cuda-test --opt-sub-quad-attention --disable-nan-check}
    expose:
      - "7860"
    volumes:
      - ./data/comfyui/models:/opt/stable-diffusion-webui/models
      - ./data/automatic1111/output:/opt/stable-diffusion-webui/outputs
    group_add:
      - "${OLLAMA_RENDER_GID:-105}"
      - "${OLLAMA_VIDEO_GID:-44}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    networks:
      - paperless-ai

  paddleocr-api:
    profiles: ["ocr-extra"]
    build:
      context: ./docker/paddleocr-api
      dockerfile: Dockerfile
    container_name: paperless-paddleocr-api
    restart: unless-stopped
    cpus: "${PADDLEOCR_CPUS:-2.00}"
    mem_limit: "${PADDLEOCR_MEM_LIMIT:-2g}"
    env_file:
      - ./.env
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-german}
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-cpu}
      PADDLEOCR_CPU_THREADS: ${PADDLEOCR_CPU_THREADS:-4}
      PADDLEOCR_ENABLE_MKLDNN: ${PADDLEOCR_ENABLE_MKLDNN:-true}
    ports:
      - "${PADDLEOCR_BIND_HOST:-127.0.0.1}:${PADDLEOCR_PUBLIC_PORT:-8091}:8091"
    volumes:
      - ./data/paddleocr-cache:/root/.paddlex
    devices:
      - /dev/dri:/dev/dri
    networks:
      - paperless-ai

  llama-cpp:
    profiles: ["llama-cpp"]
    build:
      context: ./docker/llama-cpp
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/ggml-org/llama.cpp.git}
        LLAMA_CPP_COMMIT: ${LLAMA_CPP_COMMIT:-3fc65063d9c356510b86fc2f15ca8aea711bfc47}
    container_name: paperless-llama-cpp
    restart: unless-stopped
    cpus: "${LLAMA_CPP_CPUS:-6.00}"
    mem_limit: "${LLAMA_CPP_MEM_LIMIT:-8g}"
    command: >
      /src/build/bin/llama-server
      -m /models/${LLAMA_CPP_MODEL:-Qwen3.5-4B-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers ${LLAMA_CPP_GPU_LAYERS:-99}
      --ctx-size ${LLAMA_CPP_CTX_SIZE:-16384}
      --threads ${LLAMA_CPP_THREADS:-4}
      --reasoning-budget ${LLAMA_CPP_REASONING_BUDGET:-0}
      --log-prefix
    ports:
      - "${LLAMA_CPP_BIND_HOST:-0.0.0.0}:${LLAMA_CPP_PUBLIC_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ${LLAMA_CPP_MODELS_PATH:-/volume1/docker/llama-cpp-test/models}:/models:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - paperless-ai

  opencode:
    profiles: ["opencode"]
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
    image: paperless-opencode:${OPENCODE_IMAGE_TAG:-latest}
    container_name: paperless-opencode
    restart: unless-stopped
    cpus: "${OPENCODE_CPUS:-2.00}"
    mem_limit: "${OPENCODE_MEM_LIMIT:-2g}"
    depends_on:
      ollama:
        condition: service_started
    stdin_open: true
    tty: true
    command:
      - opencode
      - serve
      - --hostname
      - ${OPENCODE_HOSTNAME:-0.0.0.0}
      - --port
      - ${OPENCODE_PORT:-4096}
    environment:
      HOME: /home/opencode
      OPENAI_API_KEY: ${OPENCODE_OPENAI_API_KEY:-dummy}
      OPENAI_BASE_URL: ${OPENCODE_OPENAI_BASE_URL:-http://llama-cpp:8080/v1}
      OLLAMA_HOST: ${OPENCODE_OLLAMA_HOST:-http://ollama:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_DEFAULT_MODEL: ${OPENCODE_DEFAULT_MODEL:-orfree/gpt-oss-20b-free}
      OPENCODE_DEFAULT_AGENT: ${OPENCODE_DEFAULT_AGENT:-build}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    volumes:
      - ${OPENCODE_WORKSPACE_HOST_PATH:-/volume4/AI-TEST/workspace/opencode}:/workspace:rw
      - ${OPENCODE_CONFIG_HOST_PATH:-./data/opencode}:/home/opencode/.config/opencode:rw
    networks:
      - paperless-ai

networks:
  paperless-ai:
    name: paperless-ai
